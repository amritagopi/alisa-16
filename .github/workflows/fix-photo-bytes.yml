name: fix-photo-bytes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply exact byte fixes
        run: |
          if [ ! -f scripts/fix-photo-bytes.py ]; then
            exit 0
          fi
          python3 scripts/fix-photo-bytes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Фото"
          git push
